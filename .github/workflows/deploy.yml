name: Portfolio CI and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and test static production image
        run: docker build --pull -t ahmed-portfolio:${{ github.sha }} .
      - name: Verify static routes in production container
        run: |
          docker run -d --name portfolio-check -p 127.0.0.1:18081:8080 ahmed-portfolio:${{ github.sha }}
          trap 'docker logs --tail=40 portfolio-check; docker rm -f portfolio-check' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://127.0.0.1:18081/healthz
          for path in / /services/ /blogs/ /landing-pages/inner-green-3d.html; do
            curl --fail --silent --show-error "http://127.0.0.1:18081$path" > /dev/null
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/nonexistent-deployment-check/)" = 404
      - name: Package tested image
        if: github.event_name != 'pull_request'
        run: |
          mkdir bundle
          docker save ahmed-portfolio:${{ github.sha }} | gzip > bundle/image.tar.gz
          cp -R deploy bundle/deploy
          tar -czf release.tgz -C bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: portfolio-release
          path: release.tgz
          retention-days: 1
          compression-level: 0
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ahmed-esmail.tech
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portfolio-release
      - name: Deploy tested release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          options=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          scp "${options[@]}" release.tgz "$VPS_USER@$VPS_HOST:/opt/ahmed-portfolio/incoming/$RELEASE_SHA.tgz"
          ssh "${options[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/ahmed-portfolio/releases/$RELEASE_SHA && tar --no-same-owner -xzf /opt/ahmed-portfolio/incoming/$RELEASE_SHA.tgz -C /opt/ahmed-portfolio/releases/$RELEASE_SHA && bash /opt/ahmed-portfolio/releases/$RELEASE_SHA/deploy/release.sh $RELEASE_SHA"
