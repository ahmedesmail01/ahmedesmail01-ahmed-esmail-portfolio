server {
 listen 80;
 listen [::]:80;
 server_name ahmed-esmail.tech www.ahmed-esmail.tech;
 location ^~ /.well-known/acme-challenge/ { root /var/www/ahmed-portfolio-acme; }
 location / { return 301 https://ahmed-esmail.tech$request_uri; }
}
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name www.ahmed-esmail.tech;
 ssl_certificate /etc/letsencrypt/live/ahmed-esmail.tech/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ahmed-esmail.tech/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 return 301 https://ahmed-esmail.tech$request_uri;
}
server {
 listen 443 ssl http2;
 listen [::]:443 ssl http2;
 server_name ahmed-esmail.tech;
 ssl_certificate /etc/letsencrypt/live/ahmed-esmail.tech/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/ahmed-esmail.tech/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=15552000" always;
 location / {
  proxy_pass http://127.0.0.1:3030;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
 }
}
