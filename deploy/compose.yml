name: ahmed-portfolio
services:
  web:
    image: ahmed-portfolio:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:3030:8080"]
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
